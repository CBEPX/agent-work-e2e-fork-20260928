version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  tests: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ioplane/serial-proxy

output:
  formats:
    text:
      print-linter-name: true
      colors: true
  show-stats: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    # Security
    - gosec
    - bidichk
    - forcetypeassert

    # Correctness
    - govet
    - staticcheck
    - errcheck
    - bodyclose
    - noctx
    - nilerr
    - nilnesserr
    - durationcheck
    - fatcontext
    - copyloopvar
    - predeclared
    - recvcheck
    - gocheckcompilerdirectives

    # Error handling
    - errorlint
    - wrapcheck
    - err113
    - errname
    - errchkjson

    # Network
    - nosprintfhostport

    # Code quality
    - gocritic
    - revive
    - cyclop
    - gocognit
    - funlen
    - nestif
    - exhaustive
    - unparam
    - unconvert
    - unused
    - ineffassign
    - nakedret
    - nonamedreturns
    - goprintffuncname
    - interfacebloat

    # Performance
    - prealloc
    - perfsprint
    - intrange
    - exptostd

    # Style
    - goconst
    - dupl
    - misspell
    - sloglint
    - modernize
    - asciicheck
    - canonicalheader
    - usestdlibvars
    - whitespace
    - godot

    # Dependencies
    - depguard
    - gomoddirectives

    # Discipline
    - nolintlint

  settings:
    gosec:
      config:
        global:
          audit: "true"
    govet:
      enable:
        - shadow
        - atomic
        - copylocks
        - httpmux
    cyclop:
      max-complexity: 15
      skip-tests: true
    gocognit:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
    nestif:
      min-complexity: 4
    nakedret:
      max-func-lines: 0
    exhaustive:
      default-signifies-exhaustive: true
    interfacebloat:
      max: 10
    depguard:
      rules:
        main:
          deny:
            - pkg: "math/rand$"
              desc: "Use crypto/rand or math/rand/v2"
            - pkg: "io/ioutil"
              desc: "Deprecated in Go 1.16"
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: false

  exclusions:
    generated: strict
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
          - dupl
          - funlen
          - cyclop
          - gocognit
          - nestif
          - err113
          - wrapcheck
          - nonamedreturns
          - forcetypeassert

severity:
  default: warning
  rules:
    - linters:
        - gosec
        - errcheck
        - bodyclose
        - noctx
        - staticcheck
        - forcetypeassert
      severity: error
